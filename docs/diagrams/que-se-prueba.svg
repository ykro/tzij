      <title id="que-se-prueba-title">Qué se prueba en la demo</title>
      <desc id="que-se-prueba-desc">Qué componente de Tzij ejercita cada paso de la demo y qué verifica: el servicio de duelo manda la misma frase a David y a Goliath y mide chrF++, David traduce en la laptop sin internet con el índice híbrido como memoria de traducción, Goliath necesita red, el validador vota a ciegas desde el teléfono y la ficha del modelo y la bitácora cierran la charla.</desc>
