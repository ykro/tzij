<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tzij-architecture-title tzij-architecture-desc">
      <title id="tzij-architecture-title">Tzij: laptop sin internet frente a Google Cloud</title>
      <desc id="tzij-architecture-desc">Arquitectura de Tzij: en la laptop, que funciona sin internet, la página del traductor manda cada frase al servicio Tzij, que la traduce con David en Ollama y su índice sqlite-vec y, con internet, también con Goliath (Gemini en Vertex AI); en la nube, los Cloud Run Jobs dejan datasets y modelos en Cloud Storage, que la laptop descarga solo al preparar.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8c2f39"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <g transform="translate(-128,0)">
      <!-- ── Zones (before arrows and nodes) ── -->
      <!-- Offline boundary: everything inside works with Wi-Fi off -->
      <rect x="168" y="64" width="488" height="424" rx="8"
            fill="#8c2f39" fill-opacity="0.05" stroke="#8c2f39" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="180" y="68" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="246" y="77" fill="#8c2f39" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">FUNCIONA SIN INTERNET</text>

      <!-- Laptop -->
      <rect x="184" y="96" width="456" height="376" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="196" y="100" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="222" y="109" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">LAPTOP</text>

      <!-- Google Cloud -->
      <rect x="688" y="96" width="288" height="376" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="700" y="100" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="109" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">GOOGLE CLOUD</text>

      <!-- ── Arrows (before boxes) ── -->
      <!-- Translator page -> service: the phrase to translate -->
      <line x1="288" y1="192" x2="288" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Service -> David: the prompt with retrieved context (primary flow) -->
      <line x1="368" y1="280" x2="456" y2="280" stroke="#8c2f39" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Service -> retrieval index -->
      <line x1="288" y1="312" x2="288" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Service -> Goliath: HTTPS to Vertex AI, crosses the offline boundary -->
      <path d="M 352,248 V 232 Q 352,224 360,224 H 824 Q 832,224 832,216 V 192"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Jobs -> Cloud Storage -->
      <line x1="832" y1="328" x2="832" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Cloud Storage -> laptop, only while preparing (dashed) -->
      <path d="M 752,408 H 544 Q 536,408 536,400 V 312"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="752" y1="440" x2="368" y2="440" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ── Arrow labels ── -->

      <rect x="296" y="214" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="314" y="223" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FRASE</text>

      <rect x="388" y="262" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="271" fill="#8c2f39" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>

      <rect x="296" y="342" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="351" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECUPERA</text>

      <rect x="696" y="206" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="215" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <rect x="840" y="354" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="864" y="363" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESCRIBE</text>

      <rect x="668" y="390" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="700" y="399" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PULL-MODEL</text>

      <rect x="380" y="422" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="431" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DATA-PULL</text>

      <!-- ── Nodes ── -->

      <!-- Translator page: the demo -->
      <rect x="208" y="128" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="208" y="128" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="216" y="134" width="24" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="228" y="143" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="288" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Traductor</text>
      <text x="288" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/traductor/</text>

      <!-- Tzij service: sends the same phrase to David and Goliath -->
      <rect x="208" y="248" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="208" y="248" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="216" y="254" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="230" y="263" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="288" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Servicio Tzij</text>
      <text x="288" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI · :8787</text>

      <!-- David (focal) -->
      <rect x="456" y="248" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="248" width="160" height="64" rx="6" fill="#8c2f39" fill-opacity="0.08" stroke="#8c2f39" stroke-width="1"/>
      <rect x="464" y="254" width="28" height="12" rx="2" fill="transparent" stroke="#8c2f39" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="478" y="263" fill="#8c2f39" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="536" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">David en Ollama</text>
      <text x="536" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tzij-2026-10-mix-s7</text>

      <!-- Retrieval index (store) -->
      <rect x="208" y="384" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="208" y="384" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="216" y="390" width="28" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="230" y="399" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDX</text>
      <text x="288" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Índice sqlite-vec</text>
      <text x="288" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">embeddinggemma</text>

      <!-- Goliath (cloud) -->
      <rect x="752" y="128" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="752" y="128" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="760" y="134" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="774" y="143" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="832" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Goliath en Vertex AI</text>
      <text x="832" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gemini-3.8-flash</text>

      <!-- Cloud Run Jobs (cloud) -->
      <rect x="752" y="264" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="752" y="264" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="760" y="270" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="774" y="279" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
      <text x="832" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloud Run Jobs</text>
      <text x="832" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">datos · LoRA en L4</text>

      <!-- Cloud Storage (store) -->
      <rect x="752" y="392" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="752" y="392" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="760" y="398" width="28" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="774" y="407" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GCS</text>
      <text x="832" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloud Storage</text>
      <text x="832" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">datasets · modelos</text>

      </g>

      <!-- ── Legend ── -->
      <line x1="40" y1="504" x2="872" y2="504" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

      <rect x="40" y="532" width="14" height="10" rx="2" fill="#8c2f39" fill-opacity="0.08" stroke="#8c2f39" stroke-width="1"/>
      <text x="60" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">David (foco)</text>

      <rect x="140" y="532" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Página / servicio</text>

      <rect x="252" y="532" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="272" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Almacén</text>

      <rect x="336" y="532" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <text x="356" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Nube</text>


      <rect x="408" y="532" width="14" height="10" rx="2" fill="#8c2f39" fill-opacity="0.05" stroke="#8c2f39" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="428" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Límite sin internet</text>

      <line x1="528" y1="537" x2="556" y2="537" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="564" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Requiere internet</text>

      <line x1="664" y1="537" x2="692" y2="537" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="700" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Solo al preparar (antes del evento)</text>
    </svg>
