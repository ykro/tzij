[project]
name = "tzij"
version = "0.1.0"
description = "Tzij: Spanish <-> K'iche' translator. Data pipeline, retrieval index and evals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "sqlite-vec>=0.1.6",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
    "google-cloud-storage>=2.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0",
    "sacrebleu>=2.4",
    "python-dotenv>=1.0",
    "google-cloud-secret-manager>=2.20",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests", "duel/duel_core/tests", "duel/tests"]
pythonpath = [".", "duel"]
asyncio_mode = "auto"
markers = ["ollama: needs a local Ollama server (skipped when unavailable)"]

[tool.uv]
package = false
