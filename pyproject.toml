[project]
name = "tzij"
version = "0.1.0"
description = "Tzij: Spanish <-> K'iche' translator. Data pipeline, retrieval index and evals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "sqlite-vec>=0.1.6",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["ollama: needs a local Ollama server (skipped when unavailable)"]

[tool.uv]
package = false
